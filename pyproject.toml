[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specter-raven"
version = "1.0.0"
description = "SPECTER RAVEN — Autonomous Red Team Platform (T171)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Red Specter Security Research Ltd", email = "tech@redspecter.co.uk"}
]
keywords = [
    "red-team",
    "autonomous-security",
    "penetration-testing",
    "ai-driven",
    "specter",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking",
]

dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
specter-raven = "raven.cli:main"
raven = "raven.cli:main"

[project.urls]
Homepage = "https://github.com/redspecter/specter-raven"
Repository = "https://github.com/redspecter/specter-raven.git"
Documentation = "https://github.com/redspecter/specter-raven#readme"
"Bug Tracker" = "https://github.com/redspecter/specter-raven/issues"

[tool.hatch.build.targets.wheel]
packages = ["raven"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
